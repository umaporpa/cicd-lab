resources:
  jobs:
    dev_umaporpa_porkpork:
      name: "[dev umaporpa] pork-credit-card-fraud-detection-model"
      trigger:
        pause_status: PAUSED
        periodic:
          interval: 1
          unit: DAYS
      max_concurrent_runs: 4
      tasks:
        - task_key: 01_load_dataset
          notebook_task:
            notebook_path: ../src/01_load_dataset.ipynb
            source: WORKSPACE
          existing_cluster_id: 0318-031919-b3fa4xtr
        
        - task_key: 02_preprocessing
          depends_on:
            - task_key: 01_load_dataset
          notebook_task:
            notebook_path: ../src/02_preprocessing.ipynb
            source: WORKSPACE
          existing_cluster_id: 0318-031919-b3fa4xtr
        
        - task_key: 03_model_training
          depends_on:
            - task_key: 02_preprocessing
          notebook_task:
            notebook_path: ../src/03_model_training.ipynb
            source: WORKSPACE
          existing_cluster_id: 0318-031919-b3fa4xtr

      tags:
        dev: umaporpa
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: ctl_training_dev
        - name: schema
          default: m3
