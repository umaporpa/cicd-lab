resources:
  jobs:
    dev_umaporpa_porkpork:
      name: "[dev umaporpa] porkpork"
      trigger:
        pause_status: PAUSED
        periodic:
          interval: 1
          unit: DAYS
      max_concurrent_runs: 4
      tasks:
        - task_key: 00_setup
          notebook_task:
            notebook_path: /Workspace/Users/umaporpa@ais.co.th/.bundle/ais016_2/dev/files/src/00_setup
            source: WORKSPACE
          existing_cluster_id: 0318-031919-b3fa4xtr
        - task_key: 01_init
          depends_on:
            - task_key: 00_setup
          notebook_task:
            notebook_path: /Workspace/Users/umaporpa@ais.co.th/.bundle/ais016_2/dev/files/src/01_init
            source: WORKSPACE
          existing_cluster_id: 0318-031919-b3fa4xtr
        - task_key: 02_aggregate
          depends_on:
            - task_key: 00_setup
          notebook_task:
            notebook_path: /Workspace/Users/umaporpa@ais.co.th/.bundle/ais016_2/dev/files/src/02_aggregate
            source: WORKSPACE
          existing_cluster_id: 0318-031919-b3fa4xtr
        - task_key: 03_process
          depends_on:
            - task_key: 01_init
            - task_key: 02_aggregate
          notebook_task:
            notebook_path: /Workspace/Users/umaporpa@ais.co.th/.bundle/ais016_2/dev/files/src/02_aggregate
            source: WORKSPACE
          existing_cluster_id: 0318-031919-b3fa4xtr
      tags:
        dev: umaporpa
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: ctl_training_dev
        - name: schema
          default: m3
